name: Engine CI

on:
  pull_request:
  push:
    branches:
      - main
      - "build/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Type-check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Prototype regression tests
        run: npm test

      - name: Production build
        run: npm run build

  folding-service-contract:
    name: Folding service contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install API test dependencies
        run: python -m pip install fastapi==0.115.12 httpx==0.28.1

      - name: Run CPU-only folding service contract tests
        run: python -m unittest discover -s folding-service -p 'test_*.py'
