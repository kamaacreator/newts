name: Temporary npm audit remediation

on:
  push:
    branches:
      - "build/gold-standard-quality-gates"

permissions:
  contents: write

concurrency:
  group: npm-audit-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-lockfile:
    name: Apply compatible security fixes and verify before committing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply compatible npm security updates
        run: npm audit fix

      - name: Require zero high or critical npm findings
        run: npm audit --audit-level=high

      - name: TypeScript check
        run: npm run lint

      - name: Node regression and API integration tests
        run: npm test

      - name: Set up Python for independent RMSD validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install independent structural alignment implementation
        run: python -m pip install biopython==1.83

      - name: Cross-check RMSD against Biopython
        run: python tests/independent_rmsd_validation.py

      - name: Production build
        run: npm run build

      - name: Commit lockfile only after every software gate passes
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No npm dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: resolve npm audit findings [npm-audit-fix]"
          git push
